<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- LeksSO: Raxtor SOLO para cifras y signos de hora.

     Raxtor (Fontastica, derechos reservados: no va en este repositorio, se instala a mano en cada equipo) no trae tildes,
     ni la ñ, ni ¿ ¡, y dibuja las minúsculas como capitales. Esta regla le quita a la fuente todo menos 0-9, «:» y «%», de
     modo que, puesta la primera en una lista de fuentes, SOLO dibuja los números: las letras (y sus acentos) salen de la
     fuente siguiente. Sin la fuente instalada, esta regla no hace nada. Hay que ejecutar `fc-cache -f` tras instalarla.

     NO se declara alias de «sans-serif» ni de «DejaVu Sans»: eso cambiaría los números de las páginas web y de todos los
     programas. Se usa solo donde LeksSO lo pone a propósito (barra, bloqueo, ventanas y avisos de LeksSO). -->
<fontconfig>
  <match target="scan">
    <test name="family"><string>Raxtor</string></test>
    <edit name="charset" mode="assign">
      <charset>
        <int>0x25</int>
        <range><int>0x30</int><int>0x3a</int></range>
      </charset>
    </edit>
  </match>
</fontconfig>
