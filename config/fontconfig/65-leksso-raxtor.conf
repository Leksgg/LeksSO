<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- LeksSO: dos usos de Raxtor, según el archivo de la fuente.

     Raxtor (Fontastica, derechos reservados: no va en este repositorio, se instala a mano en cada equipo) no trae tildes,
     ni la ñ, ni ¿ ¡, y dibuja las minúsculas como capitales. Por eso no puede ser la letra de todo el texto. Se reparte así:

       «Raxtor»          (todos los archivos menos el Bold): SOLO cifras, «:» y «%». Puesta la primera en una lista de fuentes
                         dibuja los números (barra, hora, fecha); las letras y sus acentos salen de la fuente siguiente.
       «Raxtor Titulos»  (solo Raxtor-Bold.ttf): espacio, signos, cifras y MAYÚSCULAS A-Z. Es la letra de los títulos de las
                         ventanas de LeksSO, que se escriben en mayúsculas. Una Ñ o una vocal con tilde no están en la
                         fuente: salen de la siguiente de la lista (Montserrat), solo esa letra.

     NO se declara alias de «sans-serif» ni de «DejaVu Sans»: eso cambiaría las páginas web y todos los programas.
     Sin la fuente instalada, estas reglas no hacen nada. Hay que ejecutar `fc-cache -f` tras instalarla. -->
<fontconfig>
  <match target="scan">
    <test name="file" compare="contains"><string>Raxtor-Bold.ttf</string></test>
    <edit name="family" mode="assign"><string>Raxtor Titulos</string></edit>
    <edit name="charset" mode="assign">
      <charset>
        <range><int>0x20</int><int>0x5a</int></range>
      </charset>
    </edit>
  </match>
  <match target="scan">
    <test name="family"><string>Raxtor</string></test>
    <edit name="charset" mode="assign">
      <charset>
        <int>0x25</int>
        <range><int>0x30</int><int>0x3a</int></range>
      </charset>
    </edit>
  </match>
</fontconfig>
