# Terminal de LeksSO: paleta propia y copiar/pegar como en cualquier otra aplicación.
font_family      JetBrains Mono
font_size        11
window_padding_width 6
confirm_os_window_close 0
enable_audio_bell no
update_check_interval 0
allow_remote_control no
cursor_blink_interval 0

# Seleccionar con el ratón copia solo.
copy_on_select clipboard

# Ctrl+C copia si hay texto seleccionado; si no, interrumpe el programa (como en Windows Terminal).
map ctrl+c copy_or_interrupt
map ctrl+v paste_from_clipboard
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard

background #15171a
foreground #eaebed
selection_background #143c5b
selection_foreground #eaebed
cursor #79b1e0
color0  #27292c
color8  #3e4145
color1  #ff735a
color9  #ff735a
color2  #85ce6c
color10 #85ce6c
color3  #f4c855
color11 #f4c855
color4  #79b1e0
color12 #9fcaee
color5  #e492c9
color13 #e492c9
color6  #79b1e0
color14 #9fcaee
color7  #eaebed
color15 #ffffff
