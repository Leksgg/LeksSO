# HDMI: solo PCM. El paso directo de audio comprimido (E-AC3 y similares) a la tele podía atascar la reproducción.
# Para un amplificador que sí lo admita: pon otra regla en ~/.config/wireplumber/wireplumber.conf.d/.
monitor.alsa.rules = [
  {
    matches = [ { node.name = "~alsa_output.*(hdmi|HDMI).*" } ]
    actions = { update-props = { iec958.codecs = [ "PCM" ] } }
  }
]
