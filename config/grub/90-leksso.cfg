# LeksSO: el menú de arranque se ve 2 segundos, para poder elegir «LeksSO: volver a la versión anterior» si el escritorio no
# arranca. Con GRUB_TIMEOUT=0 (lo habitual tras instalar) el menú no llega a mostrarse y esa entrada no se podría elegir.
# Cuesta 2 segundos en cada arranque. Para quitarlo: sudo rm /etc/default/grub.d/90-leksso.cfg && sudo update-grub
# (la entrada de «volver» sigue en el menú, pero hay que mantener pulsada la tecla Mayús al encender para verlo).
GRUB_TIMEOUT_STYLE=menu
GRUB_TIMEOUT=2
